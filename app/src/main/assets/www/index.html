<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FieldOps Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .badge { font-size: 12px; color: #34d399; font-weight: 600; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 0;
      background: #059669;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
    .log { font-family: monospace; font-size: 12px; color: #cbd5e1; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FieldOps</h1>
    <span class="badge">Offline Ready</span>
  </div>
  <div class="card">
    <div class="label">Active Checklists</div>
    <div class="value" id="count">4</div>
  </div>
  <div class="card">
    <div class="label">Last Synced Asset Bundle</div>
    <div class="value">assets/www</div>
    <button onclick="recordCheck()">Complete Inspection</button>
    <div class="log" id="log">Ready for local WebView execution.</div>
  </div>
  <script>
    let completed = 4;
    function recordCheck() {
      completed += 1;
      document.getElementById('count').textContent = String(completed);
      document.getElementById('log').textContent = 'Saved locally at ' + new Date().toLocaleTimeString();
    }
  </script>
</body>
</html>
